services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: txnimport
      POSTGRES_USER: txnimport
      POSTGRES_PASSWORD: txnimport
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U txnimport -d txnimport"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
